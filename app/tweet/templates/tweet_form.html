{% extends "layout.html" %}

{% block title %}
Chai aur Tweet ☕✍️
{% endblock %}

{% block content %}
<style>
  .form-card {
    max-width: 600px;
    margin: auto;
    margin-top: 40px;
    animation: fadeIn 0.6s ease-in-out;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .dark-mode .form-card {
    background-color: #1e1e1e;
    color: white;
  }

  .dark-mode input,
  .dark-mode textarea,
  .dark-mode select {
    background-color: #2b2b2b;
    color: white;
    border: 1px solid #555;
  }

  .dark-mode label {
    color: #ccc;
  }
</style>

<div class="form-card card shadow p-4">
  <h2 class="text-center mb-4 text-warning">
    {% if form.instance.pk %}
      ✏️ Edit Tweet
    {% else %}
      🐦 Create Tweet
    {% endif %}
  </h2>

  <form action="" method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <div class="d-grid mt-4">
      <button type="submit" class="btn btn-warning btn-lg">Submit Tweet</button>
    </div>
  </form>

  <div class="mt-3 text-center">
    <a href="{% url 'tweet_list' %}" class="text-decoration-none">Back to Tweet List</a>
  </div>
</div>
{% endblock %}
